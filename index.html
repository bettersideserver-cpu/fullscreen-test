<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Maximized</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 40px;
      font-family: Arial;
    }
  </style>
</head>
<body>

<div class="screen">
  BetterSide Presentation
</div>

<script>
  // Try maximize window
  window.moveTo(0, 0);
  window.resizeTo(screen.availWidth, screen.availHeight);

  // Try fullscreen automatically
  window.onload = async () => {
    const elem = document.documentElement;

    try {
      if (elem.requestFullscreen) {
        await elem.requestFullscreen();
      }
    } catch (e) {
      console.log("Fullscreen blocked by browser");
    }
  };
</script>

</body>
</html>
